# The JavaScript ecosystem's root (docs/adr/0024-three-projects-share-one-repository.md, decision 1).
# `packages/*` is empty until block 3 brings the two packages with their first consumer.
packages:
  - apps/*
  - packages/*
# pnpm holds back a version published inside its release-age window, so a pin read from the
# registry on the day it is added lands here. pnpm writes these lines itself.
minimumReleaseAgeExclude:
  - '@tanstack/history@1.162.3'
  - '@tanstack/react-router@1.170.34'
  - '@tanstack/router-core@1.171.29'
  - '@types/react-dom@19.3.0'
  - '@types/react@19.3.0'
  - react-dom@19.3.0
  - react@19.3.0
  - scheduler@0.28.0
  - vite@8.3.0
