# The gate runs the whole build in one daemon: resolution, kapt, Kotlin compilation, detekt's type
# resolution over twelve modules, Kover and the Quarkus augmentation. Left at the default metaspace
# that dies with `OutOfMemoryError: Metaspace` on a cold cache, and the build then hangs rather than
# reporting, which is why this is a bound and not a suggestion.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g
