name: Validate

# Reusable workflow: the gate and the container image build. Called by the PR
# workflow (push=false) and the release workflow (push=true) so both run the
# exact same quality gate. Only the release path publishes the image to GHCR.
on:
  workflow_call:
    inputs:
      push:
        description: "Publish the container image to GHCR"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # One call, not a list of checks. `gate` is a Dagger function (`.dagger/`) and the
  # same command runs it on a workstation, so a check added to it is in CI the day it
  # lands. The JDK, libvips and python3 are the function's container, not the runner's:
  # nothing is installed here beyond the Dagger CLI.
  verify:
    runs-on: ubuntu-latest
    # A build that stops making progress has to fail rather than hold the runner: seen twice
    # on a workstation, a Gradle task dying and the build then never reporting.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        # No `call` input: the action only installs the CLI, so the line below is the
        # command a workstation types. The version pairs with dagger.json's engineVersion.
        with:
          version: "0.21.9"
      - name: Gate
        # `--progress=plain` because the default renderer redraws in place and a runner's log
        # keeps only what was printed: without it the job shows nothing between the first
        # container and the verdict, which reads exactly like a hang.
        run: dagger call --progress=plain gate

  # Build the runtime image on every run so each PR verifies it still builds,
  # and publish to GHCR only when push=true (release path). The Quarkus fast-jar
  # artifact is built once with Gradle (JVM jars are arch-independent) then
  # buildx assembles the multi-arch manifest directly.
  build-image:
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # OIDC token for keyless cosign signing (only used when push=true)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Build Quarkus artifact
        working-directory: api
        run: ./gradlew :api-application:quarkusBuild
      - name: OpenAPI document is in sync
        # The build above regenerates it, so this costs nothing here. The pre-commit hook does the
        # same locally, and a hook nobody installed regenerates nothing.
        run: git diff --exit-code -- contract/openapi.json
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/geoffreycoulaud/pinry-reborn-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern=v{{version}}
      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          # The Dockerfile, the .dockerignore and the COPY sources all live under api/, so the
          # context is that directory and the COPY paths inside it are unchanged by the move.
          context: ./api
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The suite never reads production's application.properties: the test resources share its
      # name and win by classpath order. So nothing here started what ships until this step, and a
      # datasource declaration that Ebean rejects survived a lot and a half of green builds.
      - name: Load the amd64 image locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./api
          platforms: linux/amd64
          load: true
          tags: pinry-reborn-api:smoke
          cache-from: type=gha
      - name: The image starts and reports healthy
        run: |
          docker run -d --name smoke -p 8080:8080 pinry-reborn-api:smoke
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/q/health > /dev/null 2>&1; then
              echo "healthy after ${i}s"
              docker rm -f smoke
              exit 0
            fi
            if [ -z "$(docker ps -q -f name=smoke)" ]; then
              echo "::error::the container exited before answering"
              docker logs smoke
              exit 1
            fi
            sleep 1
          done
          echo "::error::no healthy answer within 60s"
          docker logs smoke
          exit 1

      # --- SBOM generation and signed attestations (release path only) ---
      # Everything below runs only when push=true: there is no pushed image to
      # attest on PRs. GHCR/OCI refs must be lowercase, but github.repository
      # preserves the owner's original case (GeoffreyCoulaud); the SBOM/attest
      # steps reference the image by digest directly, so lowercase it here.
      - name: Compute lowercase image ref
        if: ${{ inputs.push }}
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: ${{ inputs.push }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Generate CycloneDX SBOM (standard, for external consumers)
        # Scans the final pushed image by digest; CycloneDX is the portable
        # interchange format consumers expect.
        if: ${{ inputs.push }}
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.image.outputs.ref }}
          format: cyclonedx-json
          output-file: /tmp/sbom.cyclonedx.json
          upload-artifact: "false"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Syft-JSON SBOM (native, for the VEX-aware daily scan)
        # Syft's native format preserves the image source identity
        # (ImageMetadata: tags + repoDigests). Grype needs that to resolve
        # image-scoped OpenVEX statements (pkg:oci/... products); CycloneDX
        # drops it, so the daily scan reads THIS SBOM, not the CycloneDX one.
        if: ${{ inputs.push }}
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.image.outputs.ref }}
          format: syft-json
          output-file: /tmp/sbom.syft.json
          upload-artifact: "false"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest SBOMs and VEX (keyless OIDC via cosign)
        # Three signed attestations on the pushed image (needs id-token: write
        # for OIDC and packages: write to push to GHCR):
        #   - CycloneDX  : the standard SBOM for external consumers
        #   - Syft-JSON  : consumed by grype-scan.yml (preserves image identity
        #                  so image-scoped VEX filters correctly)
        #   - OpenVEX    : so anyone scanning this image directly inherits the
        #                  not_affected triage in security/vex.openvex.json
        if: ${{ inputs.push }}
        run: |
          ref='${{ steps.image.outputs.ref }}'
          cosign attest --yes --type cyclonedx \
            --predicate /tmp/sbom.cyclonedx.json "$ref"
          cosign attest --yes --type https://syft.dev/bom \
            --predicate /tmp/sbom.syft.json "$ref"
          cosign attest --yes --type openvex \
            --predicate security/vex.openvex.json "$ref"

  # Single required check. GitHub counts a skipped job as passing for branch
  # protection, so the gate always runs (if: always()) and fails explicitly
  # unless every needed job actually reported "success".
  gate:
    needs: [verify, build-image]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Needed job results: $results"
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job did not succeed (results: $results)"
              exit 1
            fi
          done
